<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>a7sbly</title>
  <script>
  (function () {
    var lang = 'ar';
    try {
      var q = new URLSearchParams(location.search).get('lang');
      var s = localStorage.getItem('a7sbly_lang');
      if (q === 'ar' || q === 'en') lang = q;
      else if (s === 'ar' || s === 'en') lang = s;
      localStorage.setItem('a7sbly_lang', lang);
    } catch (e) {}
    location.replace('index-' + lang + '.html?lang=' + lang);
  })();
  </script>
</head>
